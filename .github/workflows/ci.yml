name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      # lib/browser-polyfill.min.js is gitignored; modules import it, so
      # take it from the pinned npm package.
      - name: Provide browser polyfill
        run: |
          mkdir -p lib
          cp node_modules/webextension-polyfill/dist/browser-polyfill.min.js lib/

      - name: Lint and test
        run: bun run test

      - name: Lint extension manifest
        run: bunx web-ext lint --source-dir . --ignore-files "tests/**" "docs/**" "*.md" "*.py" "package*.json" "bun.lock*" "eslint.config.mjs" ".github/**" "node_modules/**"
